# dsh-plugin-reme: ReMe long-term memory integration for DeepSeek Harness
# This patch inserts the ReMe tool entry into the Cordis loader tree.
# The entry registers model-facing tools for memory search, read, write,
# save, delete, proactive topics, and consolidation (dream).
# Memory files always live in the ReMe service's own workspace (server-side
# setting, default .reme/ under its startup directory) — this plugin is a
# pure HTTP client and cannot relocate it.

- insert:
    - id: tool-reme
      name: 'dsh-plugin-reme'
      config:
        # ReMe service endpoint (default: localhost:2333)
        host: '127.0.0.1'
        port: 2333
        # Default search result limit
        searchLimit: 5
        # Tool call timeout in milliseconds
        timeoutMs: 60000
